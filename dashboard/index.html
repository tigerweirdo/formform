<title>FORM/FORM Kontrol Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Yerleşim aynı: üstte durum ve araçlar, yapışkan sekmeler, kart ızgarası. Önce özet, sonra ayrıntı.
   Yüzey nötr ve sıcak. Etkileşim mürekkep rengindedir. Seri ve durum renkleri yalnız grafik ve sağlıkta
   (her zaman simge ve yazıyla birlikte). Yazı tipi: Instrument Sans, kimlik ve saatlerde Plex Mono. */
:root {
  --bg: #f3f1eb; --surface: #fbfaf6; --surface-2: #eceae3; --ink: #1c1b17; --ink-2: #4a483f; --muted: #6f6c62;
  --line: #e2dfd6; --line-2: #cfcabe;
  --accent: #1c1b17; --accent-ink: #fbfaf6; --accent-soft: rgba(28, 27, 23, 0.08);
  --s1: #3d6b84; --s2: #b5683d; --s3: #3d7358; --neg: #a33d3d;
  --good: #2f6b45; --warn: #9a6708; --serious: #b56a3c; --crit: #a33d3d; --info: #3d6b84;
  --good-soft: rgba(47, 107, 69, 0.12); --warn-soft: rgba(154, 103, 8, 0.14); --crit-soft: rgba(163, 61, 61, 0.12); --info-soft: rgba(61, 107, 132, 0.12);
  --scrim: rgba(22, 21, 17, 0.42);
  --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12110e; --surface: #1b1a16; --surface-2: #24231e; --ink: #f4f1e8; --ink-2: #c9c3b4; --muted: #918b7d;
    --line: #2c2b26; --line-2: #3d3b34;
    --accent: #f4f1e8; --accent-ink: #12110e; --accent-soft: rgba(244, 241, 232, 0.1);
    --s1: #8eb6cc; --s2: #e0a57c; --s3: #8fbfa6; --neg: #e08a84;
    --good: #8fbfa6; --warn: #e2c07a; --serious: #e0a57c; --crit: #e08a84; --info: #8eb6cc;
    --good-soft: rgba(143, 191, 166, 0.16); --warn-soft: rgba(226, 192, 122, 0.16); --crit-soft: rgba(224, 138, 132, 0.16); --info-soft: rgba(142, 182, 204, 0.16);
    --scrim: rgba(0, 0, 0, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12110e; --surface: #1b1a16; --surface-2: #24231e; --ink: #f4f1e8; --ink-2: #c9c3b4; --muted: #918b7d;
  --line: #2c2b26; --line-2: #3d3b34;
  --accent: #f4f1e8; --accent-ink: #12110e; --accent-soft: rgba(244, 241, 232, 0.1);
  --s1: #8eb6cc; --s2: #e0a57c; --s3: #8fbfa6; --neg: #e08a84;
  --good: #8fbfa6; --warn: #e2c07a; --serious: #e0a57c; --crit: #e08a84; --info: #8eb6cc;
  --good-soft: rgba(143, 191, 166, 0.16); --warn-soft: rgba(226, 192, 122, 0.16); --crit-soft: rgba(224, 138, 132, 0.16); --info-soft: rgba(142, 182, 204, 0.16);
  --scrim: rgba(0, 0, 0, 0.62);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-text-size-adjust: 100%; letter-spacing: -0.011em; }
body.noscroll { overflow: hidden; }
h1, h2, h3, h4, p, ul, ol, dl, dd, pre { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: inherit; }
.mono, code { font-family: var(--mono); font-size: 0.92em; }
.muted { color: var(--muted); }
.strong { font-weight: 600; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

.app { max-width: 1120px; margin-inline: auto; padding-inline: clamp(18px, 4vw, 36px); padding-block: 28px 72px; }
.stack-y { display: flex; flex-direction: column; gap: 22px; }
.grid2 { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); align-items: start; }
.wfgrid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
.kpis { display: grid; gap: 1px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

/* ---- üst çubuk ---- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; padding-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--ink); }
.brand h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); line-height: 1.1; }
.brand p { font-size: 13px; color: var(--muted); }
.top-r { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stamp { font-size: 12px; color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 4px 0 4px 14px; border-radius: 0; border: 0; border-left: 2px solid var(--line-2); background: transparent; margin-bottom: 14px; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.banner strong { color: var(--ink); font-weight: 600; }
.banner-demo { border-left-color: var(--warn); }
.banner-warn { border-left-color: var(--warn); }
.banner-info { border-left-color: var(--info); }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; gap: 4px; overflow-x: auto; background: var(--bg); border-bottom: 1px solid var(--line); margin: 4px 0 22px; scrollbar-width: none; }
.tabs button { flex: none; background: none; border: 0; border-bottom: 1.5px solid transparent; padding: 10px 12px 9px; font-weight: 500; color: var(--muted); display: inline-flex; gap: 7px; align-items: center; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--crit); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-weight: 600; }

/* ---- düğmeler ve denetimler ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--accent); filter: none; opacity: 0.88; }
.btn-danger { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn-danger:hover:not(:disabled) { background: var(--crit); filter: none; opacity: 0.9; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-xs { min-height: 26px; padding: 0 9px; font-size: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; padding: 3px; gap: 2px; background: transparent; border: 1px solid var(--line); border-radius: 999px; }
.seg button { min-height: 28px; padding: 0 12px; border: 0; background: none; border-radius: 999px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; box-shadow: none; }
.lnk { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.lnk-s { font-size: 12px; }
input[type="text"], input[type="search"], input[type="number"], select, textarea { min-height: 34px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); width: 100%; }
textarea { font-family: var(--mono); font-size: 12px; resize: vertical; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
.filters input[type="search"] { flex: 1 1 200px; width: auto; }
.filters select { flex: 0 1 180px; width: auto; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.fld.wide { grid-column: 1 / -1; }

/* ---- kart ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 14px; margin-bottom: 14px; }
.card-h h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
.sub { font-size: 13px; color: var(--muted); margin-top: 3px; max-width: 68ch; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; }
.eyebrow { font-size: 13px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; max-width: 75ch; }
.note-warn { padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); }
.lead { margin-bottom: 8px; }
.calm { color: var(--ink-2); }
.sep { height: 1px; background: var(--line); margin: 14px 0; }
.empty { padding: 18px; text-align: center; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; }
.empty p { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.fit { width: 100%; }

/* ---- durum kartı ve ölçüt kutuları ---- */
.status-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
.headline { font-size: 30px; line-height: 1.12; font-weight: 600; letter-spacing: -0.03em; margin-top: 4px; }
.status-ok, .status-warn, .status-crit, .status-info { background: var(--surface); }
.status-ok { border-color: var(--line); box-shadow: inset 3px 0 0 var(--good); }
.status-warn { border-color: var(--line); box-shadow: inset 3px 0 0 var(--warn); }
.status-crit { border-color: var(--line); box-shadow: inset 3px 0 0 var(--crit); }
.status-info { border-color: var(--line); box-shadow: inset 3px 0 0 var(--info); }
.issues { list-style: none; padding: 0; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.issues li { display: flex; gap: 10px; align-items: flex-start; }
.issues p { color: var(--ink-2); font-size: 12.5px; max-width: 80ch; }
.kpi { background: var(--surface); border: 0; border-radius: 0; padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.kpi-crit { box-shadow: inset 0 -2px 0 var(--crit); }
.kpi-l { font-size: 12px; color: var(--muted); }
.kpi-v { font-size: 26px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em; overflow-wrap: anywhere; }
.kpi-s { font-size: 12px; color: var(--ink-2); }
.kpi .meter, .kpi .spark { margin-top: 6px; }
.spark { display: block; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--ink); line-height: 18px; }
.chip-i { flex: none; }
.chip-ok { background: var(--good-soft); } .chip-ok .chip-i { color: var(--good); }
.chip-warn { background: var(--warn-soft); } .chip-warn .chip-i { color: #b87a00; }
.chip-crit { background: var(--crit-soft); } .chip-crit .chip-i { color: var(--crit); }
.chip-info, .chip-run { background: var(--info-soft); } .chip-info .chip-i, .chip-run .chip-i { color: var(--info); }
.chip-wait .chip-i, .chip-mute .chip-i { color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip-warn .chip-i { color: var(--warn); } }
:root[data-theme="dark"] .chip-warn .chip-i { color: var(--warn); }

.meter { height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
.meter-f { height: 100%; border-radius: 4px; background: var(--accent); }
.meter-good { background: var(--good-soft); } .meter-good .meter-f { background: var(--good); }
.meter-warn { background: var(--warn-soft); } .meter-warn .meter-f { background: var(--warn); }
.meter-crit { background: var(--crit-soft); } .meter-crit .meter-f { background: var(--crit); }

/* ---- listeler ve tablolar ---- */
.rows { list-style: none; padding: 0; display: flex; flex-direction: column; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-main, .row-side { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.row-side { color: var(--ink-2); font-size: 13px; }
.key { display: inline-block; min-width: 56px; font-weight: 500; }
.tablewrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 8px 10px; text-align: left; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl thead th { border-top: 0; border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tbl th.num, .tbl td.num { text-align: right; }
.tbl tbody th { font-weight: 500; }
.vt td { white-space: nowrap; }
.vt tr.clickable { cursor: pointer; }
.vt tr.clickable:hover { background: var(--surface-2); }
.thbtn { background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; font-weight: inherit; }
th.sorted { color: var(--ink); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.rec td, .rec th { vertical-align: top; }
.rec td:nth-child(3) { min-width: 260px; white-space: normal; }

/* ---- grafikler ---- */
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
.ax { fill: var(--muted); font: 11px var(--sans); }
.ax.strong { fill: var(--ink-2); font-weight: 500; }
.ax.accent { fill: var(--accent); font-weight: 600; }
.dl { fill: var(--ink-2); font: 600 11px var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; font-size: 12px; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.line { height: 2px; width: 16px; background: var(--ink-2); border-radius: 1px; }
.sw.ghost { height: 4px; width: 12px; background: var(--line-2); }
.stack { display: flex; gap: 2px; height: 14px; margin-bottom: 8px; }
.stack-s { min-width: 3px; border-radius: 3px; }
.hb { display: flex; flex-direction: column; gap: 10px; }
.hb-r { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) auto; gap: 4px 12px; align-items: center; }
.hb-l { display: flex; flex-direction: column; min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
.hb-l small { color: var(--muted); font-size: 11.5px; }
.hb-t { height: 14px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.hb-f { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-f.faint, .wt-f.faint { opacity: 0.45; }
.hb-v { font: 600 13px var(--mono); min-width: 44px; text-align: right; }
.odds { display: grid; gap: 22px 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); margin-top: 16px; }
.odds-d h3 { font-size: 13px; margin-bottom: 8px; }
.odds-d .btn { margin-top: 8px; }
.wt { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
.wt-axis { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) 74px; font-size: 11.5px; color: var(--muted); }
.wt-axis span:nth-child(1) { grid-column: 2; grid-row: 1; justify-self: start; }
.wt-axis span:nth-child(2) { display: none; }
.wt-axis span:nth-child(3) { grid-column: 2; grid-row: 1; justify-self: end; }
.wt-r { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) 74px; gap: 12px; align-items: center; }
.wt-l { font-size: 13px; overflow-wrap: anywhere; }
.wt-t { position: relative; height: 14px; background: var(--surface-2); border-radius: 4px; }
.wt-mid { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line-2); }
.wt-f { position: absolute; top: 0; bottom: 0; }
.wt-f.up { background: var(--s1); border-radius: 0 4px 4px 0; }
.wt-f.down { background: var(--neg); border-radius: 4px 0 0 4px; }
.wt-v { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.wt-v b { font: 600 13px var(--mono); } .wt-v small { color: var(--muted); font-size: 11px; }
.runstrip { display: flex; gap: 3px; align-items: center; }
.rs { width: 8px; height: 18px; border-radius: 2px; background: var(--line-2); display: inline-block; }
.rs-ok { background: var(--good); } .rs-fail { background: var(--crit); } .rs-running { background: var(--info); } .rs-queued, .rs-cancel { background: var(--line-2); }
.tip { position: fixed; z-index: 60; pointer-events: none; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
.tip-t { font: 600 12px var(--mono); margin-bottom: 3px; overflow-wrap: anywhere; }
.tip-l { opacity: 0.8; margin-top: 3px; }
.tip-r { display: flex; justify-content: space-between; gap: 14px; }
.tip-r b { font-weight: 600; order: 2; } .tip-r span { opacity: 0.75; order: 1; }

/* ---- öğrenme ---- */
.miles { list-style: none; padding: 0; margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.miles li { display: flex; gap: 12px; align-items: flex-start; }
.miles li .chip { flex: none; min-width: 96px; justify-content: center; }
.miles p { color: var(--ink-2); font-size: 12.5px; }
.elite { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; counter-reset: e; }
.elite li { padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); }
.elite li:hover { background: var(--surface-2); }
.elite-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.elite-h b { font-size: 16px; }
.calc { display: grid; gap: 18px 24px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); align-items: start; }
.calc-in { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.scorebig { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.scorebig b { font-size: 34px; line-height: 1; letter-spacing: -0.02em; }

/* ---- akış ---- */
.wf-d { color: var(--ink-2); font-size: 13px; margin-bottom: 10px; max-width: 60ch; }
.kvs { display: grid; gap: 8px 16px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.kvs.one { grid-template-columns: 1fr; gap: 6px; }
.kvs.one .kv { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 6px; }
.kvs.one .kv:first-child { border-top: 0; padding-top: 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { font-weight: 500; overflow-wrap: anywhere; }
.kvs.one .kv dd { text-align: right; }
.wf-f { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.wf-links { display: inline-flex; gap: 10px; align-items: center; margin-left: auto; font-size: 12px; }

/* ---- sağlık ---- */
.checks { list-style: none; padding: 0; display: flex; flex-direction: column; }
.check { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: flex-start; }
.check:first-child { border-top: 0; padding-top: 0; }
.check .chip { flex: none; min-width: 84px; justify-content: center; }
.check-b p { font-size: 12.5px; margin-top: 2px; }
.hint { color: var(--ink); }
.links { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 12.5px; }
.links.big { gap: 8px 22px; font-size: 14px; }

/* ---- kontrol ---- */
.notice { padding: 14px 16px; }
.notice-warn { background: var(--warn-soft); border-color: transparent; }
.notice-info { background: var(--info-soft); border-color: transparent; }
.notice p { margin-top: 4px; color: var(--ink-2); }
.act { display: flex; flex-direction: column; gap: 10px; }
.pre { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pre li { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; }
.pre li .chip { flex: none; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 8px; background: var(--surface-2); }
.confirm h4 { font-size: 13px; color: var(--muted); }
.effects { padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.tog { display: flex; gap: 10px; align-items: flex-start; }
.tog input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
.tog small { display: block; color: var(--muted); font-size: 12px; }

  // ------------------------------------------------------------------ cron (UTC, GitHub Actions)
  function cronField(f, lo, hi) {

    pool.sort(function (a, b) { return a - b; });

  // ------------------------------------------------------------------ zamanlayıcı uyumu: planlanan tur / gerçek çalışma

   * sinceMs: değerlendirme penceresinin başı (workflow kaydı ya da elde olan en eski çalışma). */
  function offSeasonRun(r) {
    // Başlık hangi cron’un çaldığını söyler. O anki Berlin ofseti başlıkla uyuşmuyorsa tur boştur.
    var title = String((r && (r.display_title || r.name)) || '');

    if (!want) return false;

  }

  // ------------------------------------------------------------------ istatistikler (ops/report.py'nin yapısal karşılığı)
  function realVideos(videos) { return videos.filter(function (r) { return r.video_id && !startsTest(r.video_id); }); }

  function buildStats(videos, weights, nowMs) {
    var vids = realVideos(videos);
    var wts = weights.filter(function (w) { return w.dimension && w.value; });
    var time = function (r) { return parseTimeMs(r.published_at); };
    var published = vids.filter(function (r) { return !isNaN(time(r)); }).sort(function (a, b) { return time(a) - time(b); });
    var scored = published.filter(function (r) { return isNum(r.performance_score); });
    var sc = function (r) { return num(r.performance_score); };
    var st = { videos: vids, published: published, scored: scored };

    st.posted7 = published.filter(function (r) { return nowMs - time(r) <= 7 * DAY; }).length;
    var lastN = scored.slice(-7), prevN = scored.slice(Math.max(0, scored.length - 14), Math.max(0, scored.length - 7));
    st.lastMean = lastN.length ? mean(lastN.map(sc)) : NaN;
    st.prevMean = prevN.length ? mean(prevN.map(sc)) : NaN;
    st.lastN = lastN.length; st.prevN = prevN.length;
    st.change = prevN.length >= 3 ? ((st.lastMean - st.prevMean) / Math.max(st.prevMean, 1)) * 100 : NaN;

    var group = function (list, keyFn) {
      var g = {}, order = [];
      list.forEach(function (r) { var k = keyFn(r); if (!g[k]) { g[k] = []; order.push(k); } g[k].push(r); });
      return order.map(function (k) { return { key: k, rows: g[k] }; });
    };
    st.byFormat = group(scored, function (r) { return String(r.loop_strategy || 'bilinmiyor'); })
      .sort(function (a, b) { return a.key < b.key ? -1 : 1; })
      .map(function (g) {
        var m = /(\d+)s$/.exec(g.key), dur = m ? parseFloat(m[1]) : 0;
        var ratios = dur ? g.rows.filter(function (r) { return isNum(r.avg_watch_time) && num(r.avg_watch_time) > 0; })
          .map(function (r) { return num(r.avg_watch_time) / dur; }) : [];
        return { key: g.key, n: g.rows.length, mean: mean(g.rows.map(sc)), duration: dur,
                 medianRatio: ratios.length ? median(ratios) : NaN, withWatch: ratios.length };
      });
    st.byMode = group(scored, function (r) { return String(r.selection_mode || 'bilinmiyor'); })
      .map(function (g) { return { key: g.key, n: g.rows.length, mean: mean(g.rows.map(sc)) }; });

    var evening = scored.filter(function (r) { return istHour(time(r)) >= 14; });
    st.hours = { morning: { n: morning.length, mean: morning.length ? mean(morning.map(sc)) : NaN },

    if (morning.length && evening.length) {

      return { key: w.key, dimension: w.dimension, value: w.value, weight: num(w.weight), n: num(w.sample_count),

    st.noId = vids.filter(function (r) { return !r.instagram_id; }).length;

    st.milestones = [

      { n: C.MIN_PER_BUCKET * 2, title: 'Format kıyası güvenilir olur', text: 'Her formatta en az 8 skorlu video gerekir; üç format için yaklaşık 24.' },
      { n: 30, title: 'Skor katsayılarını ayarlama zamanı', text: 'İzlenme süresi katsayıları yaklaşık değerle başladı; 30 skorlu videoda gerçek dağılıma göre ayarlanır.' }

  }

  // Tablodaki her video için tek satır: ölçüm durumu, skor ayrıntısı, trend arındırılmış skor
  function enrichVideos(videos, nowMs) {
    var real = realVideos(videos), ordered = orderedScored(real), t = trendRelative(ordered), relById = {}, rankById = {};
    ordered.forEach(function (r, i) { relById[r.video_id] = t.rel[i]; });
    ordered.slice().sort(function (a, b) { return num(b.performance_score) - num(a.performance_score); })
      .forEach(function (r, i) { rankById[r.video_id] = i + 1; });
    return real.map(function (r) {
      var m = measurement(r, nowMs), isS = isNum(r.performance_score);
      var fm = /(\d+)s$/.exec(String(r.loop_strategy || ''));
      return { row: r, id: r.video_id, pubMs: m.pubMs, m: m, scored: isS, score: isS ? num(r.performance_score) : NaN,

  // ------------------------------------------------------------------ sonraki videonun tahmini seçim olasılıkları (ops/evolve.py)
  /* evolve.generate'in tek değerli genleri için kapalı form. Monte Carlo ile Python'a karşı sınanır.

  function captionTags(caption) {
    var lines = String(caption == null ? '' : caption).trim().split('\n');
    var last = lines.length ? lines[lines.length - 1] : '';
    return last.split(/\s+/).filter(function (t) { return t.charAt(0) === '#' && t !== '#formform'; });
  }
  var ODDS_FIELDS = { structure: 'structure', palette: 'palette', motion: 'motion_quality', lighting: 'lighting', format: 'loop_strategy', sound: 'sound' };
  function weightLookup(dnaRows) {
    var m = {};
    dnaRows.forEach(function (row) {
      if (!row.dimension || !row.value) return;
      var w = num(row.weight);
      if (!finite(w) || w <= 0) return;
      m[String(row.dimension).trim() + '::' + String(row.value).trim()] = w;
    });
    return m;
  }
  function elitePool(videos) {
    var hist = videos.filter(function (r) { return r.video_id && !startsTest(r.video_id) && isNum(r.performance_score); });
    var top = hist.slice().sort(function (a, b) { return num(b.performance_score) - num(a.performance_score); }).slice(0, C.ELITE_POOL);
    var total = 0;
    top.forEach(function (r) { total += Math.max(1, num(r.performance_score)); });
    return { size: hist.length, enabled: hist.length >= C.MIN_SCORED_FOR_ELITES,

  function selectionOdds(lib, dnaRows, videos) {
    var look = weightLookup(dnaRows), pool = elitePool(videos), pe = pool.enabled ? C.ELITE_RATE : 0;
    var wOf = function (d, v) { var w = look[d + '::' + v]; return Math.max(0.0001, w === undefined ? 1 : w); };
    var out = {};
    ['structure', 'palette', 'motion', 'lighting', 'format', 'hook', 'sound'].forEach(function (d) {
      var arr = lib[d] || [], n = arr.length;

      var rows = arr.map(function (v) {

      }).sort(function (a, b) { return b.p - a.p; });

  }

  // ------------------------------------------------------------------ release ve çalışma durumları
  function parseRelease(rel) {
    var m = /^(render|claimed|published) (.+)$/.exec(String(rel.name || ''));
    var at = parseTimeMs(rel.published_at || rel.created_at);
    return { id: rel.id, name: rel.name, tag: rel.tag_name, url: rel.html_url, state: m ? m[1] : 'other',

  function runStatus(run) {
    if (!run) return 'none';

      return 'fail';

  // ------------------------------------------------------------------ sağlık denetimleri

  function worst(checks) {

function actionsTile(V) {

  var b = V.d.billing;

  if (!b) {
    var src = V.src && V.src.billing;
    if (src && src.error) return tile('Actions dakikası', '–', 'Kota okunamadı', null, 'crit');
    return tile('Actions dakikası', '…', 'GitHub kotası okunuyor');
  }
  if (!b.ok) return tile('Actions dakikası', '–', 'Anahtara Plan → Read-only izni ekleyin', null, 'crit');
  if (!FF.finite(b.remaining) || !FF.finite(b.included)) {
    return tile('Actions dakikası', FF.fmtNum(b.used, 0) + ' dk', 'Bu ay kullanılan');
  }

  return tile('Actions dakikası', FF.fmtNum(b.remaining, 0) + ' dk',
    FF.fmtNum(b.used, 0) + ' / ' + FF.fmtNum(b.included, 0) + ' kullanıldı' + (b.paid > 0 ? ' · ücretli ' + FF.fmtNum(b.paid, 0) : ''),
    meter(Math.min(b.used, b.included), b.included || 1, kind, 'Kullanılan ücretsiz Actions dakikası'),
    b.remaining <= 0 ? 'crit' : null);
}

function videoState(v, now) {
  if (v.scored) return chip('ok', 'Skorlandı');

  var s = v.m.state72;
  if (s === 'late') return chip('crit', '72 sa gecikti');
  if (s === 'due') return chip('warn', '72 sa ölçülecek');
  if (!v.m.has24 && v.m.state24 === 'late') return chip('warn', '24 sa gecikti');
  if (!v.m.has24 && v.m.state24 === 'due') return chip('warn', '24 sa ölçülecek');
  return chip('wait', v.m.has24 ? '72 sa: ' + FF.fmtRel(v.m.due72, now) : '24 sa: ' + FF.fmtRel(v.m.due24, now));
}
function filterVideos(V) {
  var f = S.filters, q = f.q.trim().toLowerCase();
  var list = V.vids.filter(function (v) {
    var r = v.row;
    if (q && (v.id + ' ' + r.structure + ' ' + r.palette + ' ' + r.motion_quality).toLowerCase().indexOf(q) < 0) return false;
    if (f.format && r.loop_strategy !== f.format) return false;
    if (f.mode && r.selection_mode !== f.mode) return false;
    if (f.state === 'scored' && !v.scored) return false;
    if (f.state === 'wait' && (v.scored || v.m.state72 === 'late' || v.m.state24 === 'late')) return false;
    if (f.state === 'late' && !(v.m.state72 === 'late' || v.m.state24 === 'late' || v.m.state72 === 'due')) return false;
    return true;
  });

    var x = col.sort(a), y = col.sort(b), xe = x == null || (typeof x === 'number' && !isFinite(x)), ye = y == null || (typeof y === 'number' && !isFinite(y));
    if (xe && ye) return 0; if (xe) return 1; if (ye) return -1;            // boşlar hep sonda

}

      else out.appendChild(h('ul', { class: 'pre' }, sc.problems.map(function (p) { return h('li', { class: 'pre-warn', text: p }); })));
    };
    paint(specCheck);
    ta.addEventListener('input', function () { c.inputs.spec = ta.value; var sc = FF.checkSpec(ta.value, LIB); paint(sc); okBtn.disabled = !canGo(sc); });
    box.appendChild(h('label', { class: 'fld wide' }, h('span', { text: 'Elle tarif (isteğe bağlı)' }), ta));
    box.appendChild(h('div', { class: 'btns' }, h('button', { class: 'btn btn-ghost btn-xs', type: 'button', onclick: function () { c.inputs.spec = sampleSpec(); scheduleRender(); } }, 'Örnek tarif ekle'),
      h('button', { class: 'btn btn-ghost btn-xs', type: 'button', onclick: function () { c.inputs.spec = ''; scheduleRender(); } }, 'Temizle')));
    box.appendChild(out);
    box.appendChild(h('p', { class: 'note', text: 'Elle tarifte açıklama (caption) ve metadata olmadığı için publish onu seçmez: yalnız deneme içindir.' }));
  }
  box.appendChild(h('h4', { text: 'Bu işlem şunları yapar' }));
  box.appendChild(h('ul', { class: 'effects' }, effectsFor(w, c).map(function (e) { return h('li', { text: e }); })));
  if (real) {
    box.appendChild(h('div', { class: 'danger', role: 'alert' }, h('strong', { text: 'Gerçek Reel paylaşılır, geri alınamaz.' }),
      h('p', { text: 'Onaylamak için aşağıya ' + CONFIRM_WORD + ' yazın.' }),
      (function () { var i = h('input', { id: 'word', type: 'text', autocomplete: 'off', autocapitalize: 'characters', value: c.word, 'aria-label': 'Onay sözcüğü' });
        i.addEventListener('input', function () { c.word = i.value; okBtn.disabled = !canGo(specCheck); }); return i; })()));
  }
  function canGo(sc) {
    if (activeRun(V, w)) return false;
    if (w.key === 'render' && sc && !sc.ok && !sc.empty) return false;
    if (real && !wordOk(c)) return false;
    if (w.key === 'publish' && !V.ready.length) return false;      // dry run da hazır render arar: yoksa NotReady ile çöker
    return true;
  }
  var okBtn = h('button', { class: 'btn ' + (real ? 'btn-danger' : 'btn-primary'), type: 'button', disabled: !canGo(specCheck),
    onclick: function () { dispatchWorkflow(w, w.key === 'render' ? FF.checkSpec(c.inputs.spec, LIB) : null); } }, real ? 'Onayla ve paylaş' : (w.key === 'publish' ? 'Denemeyi çalıştır' : 'Onayla ve çalıştır'));
  box.appendChild(h('div', { class: 'btns' }, okBtn, h('button', { class: 'btn', type: 'button', onclick: function () { c.phase = 'idle'; c.word = ''; scheduleRender(); } }, 'Vazgeç')));
  return box;
}

function runningCard(V) {
  var active = V.allRuns.filter(function (it) { var s = FF.runStatus(it.run); return s === 'running' || s === 'queued'; });
  if (!active.length && !S.cancel) return null;
  var rows = active.map(function (it) {
    var r = it.run, cc = S.cancel && S.cancel.runId === r.id ? S.cancel : null, side;
    if (!cc) side = h('button', { class: 'btn btn-xs btn-danger', type: 'button', disabled: !liveOk(), onclick: function () { S.cancel = { runId: r.id, phase: 'confirm' }; scheduleRender(); } }, 'İptal et…');
    else if (cc.phase === 'confirm') side = h('span', { class: 'btns' }, h('span', { text: 'Çalışma iptal edilsin mi?' }), h('button', { class: 'btn btn-xs btn-danger', type: 'button', onclick: function () { cancelRun(r.id); } }, 'Evet, iptal et'), h('button', { class: 'btn btn-xs', type: 'button', onclick: function () { S.cancel = null; scheduleRender(); } }, 'Vazgeç'));
    else if (cc.phase === 'sending') side = h('span', { class: 'muted', text: 'İptal isteği gönderiliyor…' });
    else side = h('span', { class: 'pre-' + cc.error.kind }, h('strong', { text: cc.error.title + '. ' }), cc.error.text, h('button', { class: 'btn btn-xs', type: 'button', onclick: function () { S.cancel = null; scheduleRender(); } }, 'Kapat'));
    return h('li', { class: 'row' }, h('div', { class: 'row-main' }, h('span', { class: 'mono key', text: it.w.key }), runChip(r), h('span', { class: 'muted', text: FF.fmtRel(FF.parseTimeMs(r.created_at), V.now) }), link('Aç', r.html_url, 'lnk lnk-s')), h('div', { class: 'row-side' }, side));
  });
  return card('Şu an çalışanlar', 'Yarıda kesilen render ya da learn güvenlidir (sonraki turda yeniden denenir). publish’i yarıda kesmek release’i “claimed” bırakabilir.', h('ul', { class: 'rows' }, rows));
}

var RECOVERY = [
  ['Render başarısız', 'Akış’ta kırmızı çalışma, hata issue’su', 'Çalışma günlüğünde kırmızı adıma bakın. Düzeltince render’ı, bitince publish’i çalıştırın.', 'actions/workflows/render.yml'],
  ['Yayın saatinde hazır render yok', 'publish: “Yayınlanacak render yok”', 'render’ı çalıştırın; bitince publish’i çalıştırın. Sonraki yayın saati de en yeni hazır render’ı alır.', 'actions/workflows/render.yml'],
  ['Release “claimed” kaldı', 'publish kırmızı', 'Önce Instagram’a bakın. Paylaşıldıysa release adını “published <video_id>” yapın. Paylaşılmadıysa sebebi giderip adını “render <video_id>” yapın.', 'releases'],
  ['Paylaşım sonucu belirsiz', 'Hata metni: PublishUncertain', 'Önce Instagram’a bakın. Paylaşıldıysa release adını “published <id>” yapıp videos.csv’ye satırı ekleyin. Tekrar paylaşmayın.', 'releases'],
  ['Jeton yok ya da bozuk', 'publish: “Geçerli bir Instagram jetonu yok”', 'IG_ACCESS_TOKEN gizli değerini yeni bir jetonla güncelleyin. Hiçbir şey değişmemiştir.', 'settings/secrets/actions'],
  ['Veri dalına yazılamadı', 'Hata metni: “veri dalına yazılamadı”', 'Geçicidir. Çalışmayı yeniden başlatın.', 'actions']
];
function renderControl(V) {
  var root = h('div', { class: 'stack-y' }), live = liveOk(), who = STANDALONE ? 'GitHub erişim anahtarınızla' : 'GitHub bağlayıcınızla';
  root.appendChild(h('section', { class: 'card notice ' + (live ? 'notice-warn' : 'notice-info') },
    h('strong', { text: live ? 'Bu sekmedeki düğmeler gerçek sistemi çalıştırır.' : 'Bu sekme şu an yalnız okunur.' }),
    h('p', { text: live ? 'İşlemler ' + who + ', sizin yetkinizle yapılır. Her işlem önce ne yapacağını gösterir ve onayınızı ister. Gerçek paylaşım ayrıca yazılı onay ister.'
      : (S.mode === 'demo' ? 'Örnek veri kipinde hiçbir şey çalıştırılmaz. Canlı veriye geçmek için üstteki anahtarı kullanın.' : (STANDALONE ? 'Erişim anahtarı girilene kadar işlem yapılamaz.' : 'GitHub bağlayıcısı bağlanana kadar işlem yapılamaz.')) })));
  var running = runningCard(V);
  if (running) root.appendChild(running);
  root.appendChild(h('div', { class: 'wfgrid' }, W.map(function (w) { return actionCard(V, w); })));
  root.appendChild(card('Kurtarma rehberi', 'Sık görülen durumlar ve ne yapılacağı (README.md ile aynı)',
    h('div', { class: 'tablewrap' }, h('table', { class: 'tbl rec' }, h('thead', null, h('tr', null, ['Durum', 'Ne görürsünüz', 'Ne yapılır', ''].map(function (x) { return h('th', { text: x }); }))),
      h('tbody', null, RECOVERY.map(function (r) { return h('tr', null, h('th', { scope: 'row', text: r[0] }), h('td', { class: 'muted', text: r[1] }), h('td', { text: r[2] }), h('td', null, link('GitHub’da aç', GH + '/' + r[3], 'lnk lnk-s'))); }))))));
  root.appendChild(card('Bağlantılar', 'Doğrudan GitHub sayfaları', h('div', { class: 'links big' },
    link('Actions', GH + '/actions'), link('Release’ler', GH + '/releases'), link('Issue’lar', GH + '/issues'), link('veri dalı', GH + '/tree/veri'),
    link('Gizli değerler', GH + '/settings/secrets/actions'), link('Depo', GH))));
  return root;
}
/* ====================================================================== çizim ve açılış */
function renderHeader(V) {
  var pill = $('statusPill'), loaded = Object.keys(V.src).some(function (k) { return V.src[k].ok; });
  var kind = S.mode === 'live' && !loaded ? 'info' : (V.level === 'crit' ? 'crit' : (V.level === 'warn' ? 'warn' : 'ok'));
  var text = S.mode === 'live' && !loaded ? 'Bağlanıyor' : (V.level === 'crit' ? 'Sorun var' : (V.level === 'warn' ? 'Dikkat' : 'Sağlıklı'));
  if (S.setup) { kind = 'info'; text = 'Anahtar gerekli'; }
  clear(pill); pill.appendChild(chip(kind, text));
  var seg = $('modeSeg'); clear(seg);
  seg.appendChild(h('button', { type: 'button', class: S.mode === 'live' ? 'on' : '', 'aria-pressed': S.mode === 'live' ? 'true' : 'false', disabled: S.mcp === null || S.mcp === undefined && S.mode !== 'live', onclick: function () { setMode('live'); } }, 'Canlı'));
  seg.appendChild(h('button', { type: 'button', class: S.mode === 'demo' ? 'on' : '', 'aria-pressed': S.mode === 'demo' ? 'true' : 'false', onclick: function () { setMode('demo'); } }, 'Örnek veri'));
  $('keyBtn').hidden = !STANDALONE;
  var rb = $('refreshBtn'); rb.disabled = S.refreshing || (S.mode === 'live' && (!S.mcp || (STANDALONE && !S.token))); rb.textContent = S.refreshing ? 'Yenileniyor…' : 'Yenile';
  var at = 0;
  Object.keys(S.src).forEach(function (k) { if (S.src[k].at && S.src[k].at > at) at = S.src[k].at; });
  $('stamp').textContent = S.mode === 'demo' ? 'Örnek veri · gerçek değil' : (at ? 'Güncellendi ' + FF.fmtClock(at) : '');
}
function renderBanner(V) {
  var b = $('banner'), info = null;
  if (S.setup) { clear(b); b.hidden = true; return; }
  if (S.mode === 'demo') {
    info = { kind: 'demo', title: 'Örnek veri gösteriliyor. Bu sayfadaki hiçbir sayı gerçek değil.',
             text: (S.demoReason ? S.demoReason + '. ' : '') + 'Gerçek veri henüz azsa panelin dolu halini görmek için kullanılır. Tüm hesaplar gerçek mantıkla yapılır.',
             action: S.mcp ? { label: 'Canlı veriye dön', fn: function () { setMode('live'); } } : null };
  } else if (S.mcp === undefined) {
    info = { kind: 'info', title: 'GitHub’a bağlanılıyor…', text: 'Bağlayıcı hazır olunca veriler okunur.' };
  } else {
    var keys = SOURCES.map(function (s) { return s.key; }), states = keys.map(srcState);
    var anyResp = keys.some(function (k) { return S.src[k]; });
    var failing = states.filter(function (s) { return s.error; });
    if (!STANDALONE && !anyResp && Date.now() - S.firstCallAt > 3500) info = { kind: 'info', title: 'GitHub erişimi için izin bekleniyor', text: 'Açılan pencerede bu sayfaya GitHub erişimi verin. Yanıt gelmezse Yenile’ye basın.' };
    else if (failing.length && failing.length >= Math.ceil(states.length * 0.8) && failing.every(function (s) { return s.error.code === failing[0].error.code; })) {
      var e = explainError(failing[0].error); info = { kind: 'warn', title: e.title, text: e.fix };
    } else if (failing.length) info = { kind: 'warn', title: failing.length + ' veri kaynağı okunamadı', text: 'Etkilenen bölümlerde son iyi veri (varsa) gösterilir. Ayrıntı: Sağlık sekmesi → Veri kaynakları.', action: { label: 'Sağlık', fn: function () { go('saglik'); } } };
  }
  if (!info && STANDALONE && S.stickyNote) info = { kind: 'warn', title: 'Dikkat.', text: S.stickyNote };
  clear(b);
  if (!info) { b.hidden = true; return; }
  b.hidden = false; b.className = 'banner banner-' + info.kind;
  b.appendChild(h('div', null, h('strong', { text: info.title }), h('span', { text: ' ' + info.text })));
  if (info.action) b.appendChild(h('button', { class: 'btn', type: 'button', onclick: info.action.fn }, info.action.label));
}
function renderTabs(V) {
  var nav = $('tabs'); clear(nav); nav.hidden = !!S.setup;
  var bad = V.health.filter(function (c) { return c.level === 'crit' || c.level === 'warn'; }).length;
  TABS.forEach(function (t, i) {
    var on = t.id === S.tab, b = h('button', { type: 'button', role: 'tab', id: 'tab-' + t.id, class: on ? 'on' : '', 'aria-selected': on ? 'true' : 'false', 'aria-controls': 'main', tabindex: on ? '0' : '-1',
      onclick: function () { go(t.id); } }, t.label, t.id === 'saglik' && bad ? h('span', { class: 'badge', text: String(bad), 'aria-label': bad + ' uyarı' }) : null);
    b.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : (e.key === 'ArrowLeft' ? -1 : 0);
      if (!d) return;
      e.preventDefault(); var n = TABS[(i + d + TABS.length) % TABS.length]; go(n.id); var nb = $('tab-' + n.id); if (nb) nb.focus();
    });
    nav.appendChild(b);
  });
}

function typing(el) {                 // yazı yazılan alan: arka plan yenilemesi bunu bozmamalı (işaret ve seçim kutuları dışında)
  return !!el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && /^(text|search|number|password|)$/.test(el.type)));
}
function render(force) {
  var ae = document.activeElement, main = $('main');
  if (!force && typing(ae) && main.contains(ae)) { S.dirty = true; return; }   // yazarken sayfa elinizden alınmaz
  var focusId = ae && ae.id && main.contains(ae) ? ae.id : '';
  S.dirty = false;
  var V = derive(), y = window.scrollY;
  renderHeader(V); renderBanner(V); renderTabs(V);
  var tab = TABS.filter(function (t) { return t.id === S.tab; })[0] || TABS[0];
  main.setAttribute('aria-labelledby', 'tab-' + tab.id);
  clear(main);
  try { main.appendChild(S.setup ? renderSetup(V) : tab.render(V)); }
  catch (err) {
    if (window.console) console.error(err);
    main.appendChild(card('Bu sekme çizilemedi', 'Diğer sekmeler çalışmaya devam eder.', h('div', null, h('p', { class: 'note note-warn', text: String((err && err.message) || err) }), h('button', { class: 'btn', type: 'button', onclick: function () { go('genel'); } }, 'Genel’e dön'))));
  }
  renderDrawer(V);
  document.body.classList.toggle('noscroll', !!S.openVideo);
  if (focusId) { var again = $(focusId); if (again && again !== document.activeElement) again.focus(); }   // klavye kullanıcısı yerini kaybetmez
  if (!force) window.scrollTo(0, y);
}

function enterDemo(reason) {
  S.mode = 'demo'; S.demoReason = reason || ''; S.setup = false;
  S.demo = FF.makeDemo(Date.now(), LIB, 7); S.now = Date.now(); S.ver++;
  render(true);
}
function setMode(m) {
  if (m === S.mode) return;
  if (m === 'live') { if (!S.mcp) return; S.mode = 'live'; S.demoReason = ''; S.setup = STANDALONE && !S.token; S.ver++; render(true); }
  else enterDemo(S.mcp ? 'Örnek veri seçildi' : S.demoReason);
}
function refresh() {
  if (S.mode === 'demo') { S.demo = FF.makeDemo(Date.now(), LIB, 7); S.now = Date.now(); S.ver++; render(true); return; }
  if (!S.mcp) return;
  S.refreshing = true; render(true);
  var done = function () { setTimeout(function () { S.refreshing = false; scheduleRender(); }, 1200); };
  S.mcp.invalidate(SERVER).then(done, done);
}

function boot() {
  var hash = String(location.hash || '').replace('#', '');
  var saved = store.get('tab', 'genel');
  S.tab = TABS.some(function (t) { return t.id === hash; }) ? hash : (TABS.some(function (t) { return t.id === saved; }) ? saved : 'genel');
  $('refreshBtn').addEventListener('click', refresh);
  window.addEventListener('hashchange', function () { var id = String(location.hash || '').replace('#', ''); if (id !== S.tab && TABS.some(function (t) { return t.id === id; })) go(id); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.openVideo) closeVideo(); });
  document.addEventListener('focusout', function () { if (S.dirty) setTimeout(function () { if (!typing(document.activeElement)) render(); }, 0); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { S.now = Date.now(); scheduleRender(); } });
  setInterval(function () { S.now = Date.now(); scheduleRender(); }, 30000);
  render(true);
  if (STANDALONE) { startStandalone(); return; }
  var api = window.claude;
  if (!api || typeof api.use !== 'function') { enterDemo('Bu sayfa Claude dışında açıldı, GitHub bağlayıcısı yok'); return; }
  S.firstCallAt = Date.now();
  api.use('mcp').then(function (mcp) {
    if (!mcp) { S.mcp = null; enterDemo('GitHub bağlayıcısı bu görünümde kullanılamıyor'); return; }
    S.mcp = mcp;
    SOURCES.forEach(watchSource);
    S.ver++; scheduleRender();
  }, function () { S.mcp = null; enterDemo('GitHub bağlayıcısı başlatılamadı'); });
}
boot();
})();
</script>
