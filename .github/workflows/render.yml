name: FORMFORM render

# Planlayıcı + render. Her gün 06:30 ve 18:30'da (Berlin) kendiliğinden çalışır, elle de başlatılabilir.
# Turu saat (Cloudflare Worker) başlatır. Saat bir turu kaçırırsa nöbetçi (FORMFORM watch) günde iki kez bakıp başlatır.
# Bu workflow'un kendi zamanlayıcısı yoktur: saat işi yaptığında bile açılan boş yedek turlar dakika harcıyordu.
#   1. Evrim motoru yeni bir video tarifi üretir (veri dalındaki videolar ve öğrenilen ağırlıklarla)
#   2. Prosedürel render (ücretsiz, harici servis yok): 1080p görüntü + tarife bağlı ambient ses, kalite kapısı
#   3. "render-<video_id>" etiketli, "render <video_id>" adlı release: video.mp4 + gövdede tarif/caption/metadata
# Aylık ücretsiz dakika bütçesi (2000) bekçi tarafından korunur: yalnız render'ı değil tüm workflow'ların harcamasını
# sayar, bütçe daralınca daha kısa ve ekonomik videolara geçer.
# Yayın ayrı workflow'dadır (FORMFORM publish, 08:00 / 20:00). Render süresi paylaşım saatini kaydırmaz.
run-name: render (${{ inputs.clock && 'saat' || (inputs.watch && 'nöbet' || 'elle') }})

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'İsteğe bağlı elle tarif (JSON, video_id zorunlu). Boş bırakırsanız evrim motoru üretir.'
        required: false
        type: string
        default: ''
      clock:
        description: 'Saat işaretler. Elle çalıştırırken boş bırakın.'
        required: false
        type: boolean
        default: false
      watch:
        description: 'Nöbetçi işaretler. Elle çalıştırırken boş bırakın.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write     # release ve veri dalı
  issues: write       # hata bildirimi
  actions: write      # ay içi toplam dakikayı okumak (bütçe bekçisi) ve nöbetçi turunda yayını başlatmak

# Aynı anda tek render
concurrency:
  group: formform-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45     # 30 sn 1080p + ses tahminen ~25 dk; yayın 75 dk sonra, arada pay kalır
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      # Girdi ortam değişkeni olarak geçer, kabuk komutuna gömülmez (enjeksiyon güvenliği).
      FORMFORM_SPEC: ${{ inputs.spec }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Süre sayacı (aylık dakika bütçesi için)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: render/requirements.txt

      - name: Bağımlılıklar
        run: |
          pip install -r render/requirements.txt
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q ' aac '

      - name: Tarif (evrim motoru)
        run: python -m ops plan --out out --spec-env FORMFORM_SPEC     # RENDER_ID'yi sonraki adımlara verir

      - name: Render
        run: python render/render.py --spec out/release.json --out out/video.mp4

      - name: Çıktıyı doğrula
        run: python render/check.py out/video.mp4 --spec out/release.json     # tarifte ses varsa ses akışı zorunlu

      - name: Release olarak yayınla
        run: |
          tag="render-$RENDER_ID"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" out/video.mp4 \
            --title "render $RENDER_ID" \
            --notes-file out/release.json \
            --target "$GITHUB_SHA" \
            --latest=false

      - name: Eski render release'lerini temizle (son 30 kalır)
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("render-"))] | sort_by(.createdAt) | reverse | .[30:] | .[].tagName' \
            | while read -r t; do gh release delete "$t" --cleanup-tag --yes; done

      # Nöbetçinin başlattığı render saatinde bitmedi: yayın ve TikTok yuvaları kaçmışsa onları da başlatır.
      # Saatin başlattığı turda çalışmaz (o turların yayını kendi saatinde başlar).
      - name: Nöbetçi turu (kaçan yayını da başlat)
        if: success() && inputs.watch
        continue-on-error: true
        run: python -m ops watch --after-render

      - name: Hata bildirimi
        if: failure()
        run: python -m ops alert --workflow "FORMFORM render" --run-url "$RUN_URL"

      - name: Düzeldi (açık hata kaydını kapat)
        if: success()
        continue-on-error: true
        run: python -m ops resolve --workflow "FORMFORM render"

      # Başarılı da başarısız da dakika harcar: ay içindeki toplam kaydedilir, bütçe bekçisi bunu okur (ops/budget.py)
      - name: Dakika kullanımını kaydet
        if: always()
        continue-on-error: true
        run: python -m ops usage --since "$JOB_T0" --spec out/release.json
